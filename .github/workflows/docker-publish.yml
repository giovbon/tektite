name: CI and Docker publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Frontend tests
        run: |
          npm ci --prefix web/frontend
          npm test --prefix web/frontend

      - name: Install Playwright browser
        run: npx --prefix web/frontend playwright install --with-deps chromium

      - name: Frontend end-to-end tests
        run: npm run test:e2e --prefix web/frontend

      - name: Check generated frontend artifacts
        run: |
          bash build-js.sh
          bash build-tailwind.sh
          if ! git diff --exit-code -- web/frontend/app.js web/frontend/app.js.map web/frontend/vendor/MANIFEST.json web/frontend/vendor/markmap/markmap.js web/frontend/vendor/markmap/markmap.js.LEGAL.txt web/frontend/vendor/markmap/THIRD_PARTY_NOTICES.txt web/frontend/tailwind.css; then
            echo "::error::Generated frontend artifacts are stale. Run ./build-js.sh and ./build-tailwind.sh and commit the result."
            exit 1
          fi

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: true

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/pkm-notes-backend-amd64 ./backend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/pkm-notes-backend-arm64 ./backend
          ls -lh bin/
          # Fail the workflow if any artifact is not an ELF binary
          for f in bin/pkm-notes-backend-*; do
            head -c 4 "$f" | grep -q ELF || { echo "ERROR: $f is not an ELF binary"; exit 1; }
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: giovoni/tektite
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max