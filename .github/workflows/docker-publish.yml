name: CI and Docker publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # O namespace da imagem PRECISA ser o mesmo da conta dona do DOCKERHUB_TOKEN.
  # Usar o secret evita o erro "insufficient_scope" causado por publicar em um
  # namespace diferente do usuário autenticado (ex.: giovoni x giovbon).
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tektite

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet -tags "sqlite_fts5 sqlite_omit_load_extension" ./...

      - name: Go test
        run: go test -tags "sqlite_fts5 sqlite_omit_load_extension" ./...

      - name: Go race detector
        run: go test -tags "sqlite_fts5 sqlite_omit_load_extension" -race ./...

      - name: Go coverage
        run: |
          go test -tags "sqlite_fts5 sqlite_omit_load_extension" \
            -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Cobertura do backend: ${total}%"
          awk -v total="$total" 'BEGIN { if (total < 65) { print "Cobertura abaixo de 65%"; exit 1 } }'

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -tags "sqlite_fts5 sqlite_omit_load_extension" ./...

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Frontend tests
        working-directory: web/frontend
        run: npm test

      - name: Frontend lint
        working-directory: web/frontend
        run: npm run lint

      - name: Install Playwright browser
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend end-to-end tests
        working-directory: web/frontend
        run: npm run test:e2e

      - name: Frontend build (if configured)
        working-directory: web/frontend
        run: npm run build --if-present

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Defina os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (Access Token com Read & Write)."
            exit 1
          fi

          # Pede um token com escopo de push e confere o que o Docker Hub concedeu.
          # Token somente leitura gera exatamente o erro "insufficient_scope".
          if ! token_json=$(curl -fsS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DOCKERHUB_USERNAME}/tektite:push,pull"); then
            echo "::error::Falha ao autenticar no Docker Hub. Verifique DOCKERHUB_USERNAME e DOCKERHUB_TOKEN."
            exit 1
          fi

          jwt=$(printf '%s' "${token_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          python3 - "${jwt}" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          actions = {a for entry in claims.get("access", []) for a in entry.get("actions", [])}

          if "push" not in actions:
              sys.exit(
                  "::error::O DOCKERHUB_TOKEN não tem permissão de escrita. "
                  "Gere um Access Token com Read & Write em "
                  "https://hub.docker.com/settings/security e atualize o secret."
              )

          print("Credenciais OK: token com permissão de push.")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # O Dockerfile compila o backend com cgo para cada plataforma.
      # O arm64 é emulado via QEMU, por isso o setup acima.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
