name: CI and Docker publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -tags sqlite_fts5 ./...

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Frontend dependencies
        working-directory: web/frontend
        run: npm install --legacy-peer-deps

      - name: Frontend tests
        working-directory: web/frontend
        run: npm test

      - name: Frontend build (if configured)
        working-directory: web/frontend
        run: npm run build --if-present

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: true

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -tags sqlite_fts5 -o bin/pkm-notes-backend-amd64 ./backend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -tags sqlite_fts5 -o bin/pkm-notes-backend-arm64 ./backend
          ls -lh bin/
          # Fail the workflow if any artifact is not an ELF binary
          for f in bin/pkm-notes-backend-*; do
            head -c 4 "$f" | grep -q ELF || { echo "ERROR: $f is not an ELF binary"; exit 1; }
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: giovoni/tektite
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max