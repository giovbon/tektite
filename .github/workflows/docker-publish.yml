name: Docker publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # O namespace da imagem PRECISA ser o mesmo da conta dona do DOCKERHUB_TOKEN.
  # Usar o secret evita o erro "insufficient_scope" causado por publicar em um
  # namespace diferente do usuário autenticado (ex.: giovoni x giovbon).
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tektite

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Defina os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (Access Token com Read & Write)."
            exit 1
          fi

          # Pede um token com escopo de push e confere o que o Docker Hub concedeu.
          # Token somente leitura gera exatamente o erro "insufficient_scope".
          if ! token_json=$(curl -fsS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DOCKERHUB_USERNAME}/tektite:push,pull"); then
            echo "::error::Falha ao autenticar no Docker Hub. Verifique DOCKERHUB_USERNAME e DOCKERHUB_TOKEN."
            exit 1
          fi

          jwt=$(printf '%s' "${token_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          python3 - "${jwt}" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          actions = {a for entry in claims.get("access", []) for a in entry.get("actions", [])}

          if "push" not in actions:
              sys.exit(
                  "::error::O DOCKERHUB_TOKEN não tem permissão de escrita. "
                  "Gere um Access Token com Read & Write em "
                  "https://hub.docker.com/settings/security e atualize o secret."
              )

          print("Credenciais OK: token com permissão de push.")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # O Dockerfile compila o backend com cgo para cada plataforma.
      # O arm64 é emulado via QEMU, por isso o setup acima.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
