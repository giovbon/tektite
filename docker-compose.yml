services:
  pkm-notes:
    # Para usar a imagem publicada no Docker Hub:
    # image: giovbon/tektite:latest
    # Ou para compilar localmente:
    build:
      context: .
      dockerfile: Dockerfile
      # Construir apenas para arm64 (ARM64)
      platforms:
        - linux/arm64
    container_name: pkm-notes
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NOTES_DIR=/app/data
      # Cache do índice (gob) dentro do volume montado: o boot volta quente
      # após restarts do container. O arquivo é um cache descartável.
      - INDEX_FILE=/app/data/.pkm-notes-index.gob
      - APP_NAME=PKM Notes
      - DEFAULT_THEME=light
      # Autenticação opcional:
      # - AUTHENTICATION_ENABLED=true
      # - AUTHENTICATION_PASSWORD=sua_senha_segura
      # - AUTHENTICATION_SECRET_KEY=gere_uma_chave_aleatoria_aqui
      # - AUTHENTICATION_API_KEY=sua_api_key_opcional
    volumes:
      # Persistência dos seus dados no host:
      - ./data:/app/data
      # Opcional: montar frontend personalizado se desejar
      # - ./web/frontend:/app/web/frontend:ro