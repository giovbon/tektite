services:
  invariante:
    # Para usar a imagem publicada no Docker Hub, descomente `image` e
    # comente o bloco `build`.
    # image: giovbon/tektite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invariante
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NOTES_DIR=/app/data
      # Autenticação opcional: basta definir uma senha forte.
      # - AUTHENTICATION_PASSWORD=troque-esta-senha
      # Habilite somente quando o navegador acessar o app por HTTPS.
      # - AUTHENTICATION_COOKIE_SECURE=true
      # Captura de mensagens de um tópico ntfy na pasta Inbox.
      # Para tópicos públicos:
      # - NTFY_ENABLED=true
      # - NTFY_SERVER_URL=https://ntfy.sh
      # - NTFY_TOPIC=meu-topico
      # Para tópicos protegidos (com autenticação básica):
      # - NTFY_ENABLED=true
      # - NTFY_SERVER_URL=https://ntfy.sh
      # - NTFY_TOPIC=meu-topico
      # - NTFY_USERNAME=seu_usuario
      # - NTFY_PASSWORD=sua_senha
      # - NTFY_FOLDER=Inbox
      # - NTFY_TAGS=ntfy
    volumes:
      # Persistência dos seus dados no host.
      - ./data:/app/data
      # Opcional: montar um frontend personalizado.
      # - ./web/frontend:/app/web/frontend:ro
