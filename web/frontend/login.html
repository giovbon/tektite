<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d12">
    <title>Entrar · PKM Notes</title>
    <script>
        (() => {
            let theme = 'dark';
            try { theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch {}
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f3f5f8' : '#0b0d12';
        })();
    </script>
    <link rel="preload" href="/vendor/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <main class="login-shell">
        <header class="login-brand">
            <span class="login-mark" aria-hidden="true">P</span>
            <div>
                <h1>PKM Notes</h1>
                <p>Entre para acessar suas notas.</p>
            </div>
        </header>
        <form id="loginForm" aria-label="Entrar no PKM Notes">
            <label for="password">Senha
                <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            </label>
            <button type="submit">Entrar</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script>
        const form = document.querySelector('#loginForm');
        const password = document.querySelector('#password');
        const message = document.querySelector('#message');
        fetch('/api/auth/status')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(status => {
                if (!status.enabled || status.authenticated) location.replace('/');
            })
            .catch(error => { message.textContent = `Não foi possível verificar o acesso: ${error.message}`; });
        form.addEventListener('submit', async event => {
            event.preventDefault();
            message.textContent = '';
            form.querySelector('button').disabled = true;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password.value })
                });
                if (!response.ok) throw new Error((await response.text()).trim() || `HTTP ${response.status}`);
                location.replace('/');
            } catch (error) {
                message.textContent = error.message;
                password.focus();
            } finally {
                form.querySelector('button').disabled = false;
            }
        });
    </script>
</body>
</html>
