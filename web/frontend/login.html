<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="">
    <title>Entrar · PKM Notes</title>
    <script src="/src/theme-init.js"></script>
    <link rel="preload" href="/vendor/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/login.css">
</head>
<body>
    <main class="login-shell">
        <header class="login-brand">
            <span class="login-mark" aria-hidden="true">P</span>
            <div>
                <h1>PKM Notes</h1>
                <p>Entre para acessar suas notas.</p>
            </div>
        </header>
        <form id="loginForm" aria-label="Entrar no PKM Notes">
            <label for="password">Senha
                <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            </label>
            <button class="button" data-variant="primary" type="submit">Entrar</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script src="/src/login.js"></script>
</body>
</html>
